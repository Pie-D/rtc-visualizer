<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTC Visualizer</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
        rel="stylesheet">
    <script>
        (function () {
            var savedTheme = localStorage.getItem('rtc-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<style>
    :root {
        --bg-gradient: linear-gradient(135deg, #090a0f 0%, #151a22 100%);
        --bg-color: #090a0f;
        --panel-bg: rgba(22, 27, 37, 0.7);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
        --accent-color: #008ff3;
        /* Màu xanh dương chủ đạo */
        --accent-glow: rgba(0, 143, 243, 0.4);
        /* Bóng phát sáng màu xanh */
        --accent-hover: #00b4d8;
        /* Màu xanh khi rê chuột qua (hover) */
        --accent-green: #00f5d4;
        --accent-red: #ff0055;
        --accent-blue: #00bbf9;
        --card-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        --font-main: 'Public Sans', sans-serif;
        --font-heading: 'Public Sans', sans-serif;

        /* Theme support variables */
        --title-gradient: linear-gradient(90deg, #ffffff 0%, #a5b4fc 100%);
        --scrollbar-thumb: rgba(255, 255, 255, 0.15);
        --scrollbar-thumb-hover: rgba(255, 255, 255, 0.3);
        --input-bg: rgba(255, 255, 255, 0.04);
        --input-bg-focus: rgba(255, 255, 255, 0.08);
        --input-placeholder: rgba(255, 255, 255, 0.25);
        --strong-text: rgba(255, 255, 255, 0.6);
        --select-option-bg: #151a22;
        --details-open-border: rgba(255, 255, 255, 0.15);
        --details-content-bg: rgba(0, 0, 0, 0.12);
        --summary-hover: rgba(255, 255, 255, 0.02);
        --dot-color: rgba(255, 255, 255, 0.2);
        --pre-bg: rgba(0, 0, 0, 0.45);
        --pre-color: #b5e2fa;
        --pre-border: rgba(255, 255, 255, 0.05);
        --table-bg: rgba(0, 0, 0, 0.25);
        --th-bg: rgba(255, 255, 255, 0.04);
        --tr-hover-bg: rgba(255, 255, 255, 0.02);
        --graph-bg: rgba(0, 0, 0, 0.35);
        --candidate-td-bg: rgba(255, 255, 255, 0.02);
    }

    :root[data-theme="light"] {
        --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        --bg-color: #f8fafc;
        --panel-bg: rgba(255, 255, 255, 0.85);
        --panel-border: rgba(0, 0, 0, 0.08);
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --accent-color: #008ff3;
        --accent-glow: rgba(0, 143, 243, 0.25);
        --accent-hover: #0076c9;
        --accent-green: #0d9488;
        --accent-red: #e11d48;
        --accent-blue: #2563eb;
        --card-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.06);

        --title-gradient: linear-gradient(90deg, #0f172a 0%, #2563eb 100%);
        --scrollbar-thumb: rgba(0, 0, 0, 0.15);
        --scrollbar-thumb-hover: rgba(0, 0, 0, 0.3);
        --input-bg: rgba(0, 0, 0, 0.03);
        --input-bg-focus: rgba(0, 0, 0, 0.05);
        --input-placeholder: rgba(0, 0, 0, 0.4);
        --strong-text: rgba(0, 0, 0, 0.7);
        --select-option-bg: #ffffff;
        --details-open-border: rgba(0, 0, 0, 0.08);
        --details-content-bg: rgba(0, 0, 0, 0.015);
        --summary-hover: rgba(0, 0, 0, 0.015);
        --dot-color: rgba(0, 0, 0, 0.15);
        --pre-bg: rgba(15, 23, 42, 0.04);
        --pre-color: #0f172a;
        --pre-border: rgba(0, 0, 0, 0.08);
        --table-bg: rgba(255, 255, 255, 0.6);
        --th-bg: rgba(0, 0, 0, 0.03);
        --tr-hover-bg: rgba(0, 0, 0, 0.01);
        --graph-bg: rgba(255, 255, 255, 0.7);
        --candidate-td-bg: rgba(0, 0, 0, 0.01);
    }

    * {
        box-sizing: border-box;
        scrollbar-width: thin;
        scrollbar-color: var(--scrollbar-thumb) transparent;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }

    ::-webkit-scrollbar-track {
        background: transparent;
    }

    ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
    }

    body {
        background: var(--bg-gradient);
        color: var(--text-primary);
        font-family: var(--font-main);
        margin: 0;
        min-height: 100vh;
        padding: 30px;
        -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
        font-family: var(--font-main);
    }

    .no-script {
        text-align: center;
        padding: 40px;
        font-size: 1.2rem;
        color: var(--accent-red);
    }

    /* react-tabs overrides */
    .react-tabs {
        background: var(--panel-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        padding: 30px;
        box-shadow: var(--card-shadow);
        margin-top: 20px;
    }

    .react-tabs__tab-list {
        border-bottom: 1px solid var(--panel-border) !important;
        display: flex;
        gap: 12px;
        padding-left: 0 !important;
        margin-bottom: 30px !important;
    }

    .react-tabs__tab {
        color: var(--text-secondary);
        border: none !important;
        background: transparent !important;
        bottom: 0 !important;
        padding: 14px 28px !important;
        font-family: var(--font-heading);
        font-weight: 600;
        font-size: 1.15rem;
        border-radius: 10px 10px 0 0 !important;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
    }

    .react-tabs__tab:hover {
        color: var(--text-primary);
    }

    .react-tabs__tab--selected {
        color: var(--accent-green) !important;
    }

    .react-tabs__tab--selected::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--accent-green);
        box-shadow: 0 0 12px var(--accent-green);
        border-radius: 3px 3px 0 0;
    }

    .react-tabs__tab:focus::after {
        display: none;
    }

    /* START CSS used for raw plotting */
    #raw {
        margin-top: 10px;
    }

    details {
        background: var(--summary-hover);
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        margin-bottom: 20px;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    details[open] {
        background: var(--details-content-bg);
        border-color: var(--details-open-border);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    summary {
        font-family: var(--font-heading);
        font-weight: 600;
        padding: 18px 24px;
        cursor: pointer;
        user-select: none;
        outline: none;
        transition: background 0.2s;
    }

    summary:hover {
        background: var(--input-bg-focus);
    }

    details[open] summary {
        border-bottom: 1px solid var(--panel-border);
        color: var(--accent-green);
    }

    pre {
        background: var(--pre-bg);
        padding: 20px;
        border-radius: 10px;
        margin: 20px;
        overflow-x: auto;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.9rem;
        border: 1px solid var(--pre-border);
        color: var(--pre-color);
    }

    /* Tables */
    table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        background: var(--table-bg);
        border-radius: 10px;
        overflow: hidden;
    }

    th,
    td {
        padding: 14px 20px;
        text-align: left;
        border-bottom: 1px solid var(--panel-border);
    }

    th {
        background-color: var(--th-bg);
        color: var(--text-primary);
        font-family: var(--font-heading);
        font-weight: 600;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    tr:last-child td {
        border-bottom: none;
    }

    tr:hover td {
        background-color: var(--tr-hover-bg);
    }

    #tables>details:nth-of-type(even) {
        background-color: var(--summary-hover);
    }

    .graph {
        margin: 24px 0;
        background: var(--graph-bg);
        border-radius: 16px;
        padding: 20px;
        border: 1px solid var(--panel-border);
    }

    .candidatepairtable {
        margin: 20px;
        width: calc(100% - 40px);
    }

    .candidatepairtable td {
        background-color: var(--candidate-td-bg);
        border: 1px solid var(--panel-border);
    }

    .candidatepairtable tr:hover td {
        background-color: var(--input-bg-focus);
    }

    /* END CSS used for raw plotting */
</style>

<body>
    <noscript>
        <div class='no-script'>
            JavaScript is disabled. </br>For this to work you have to enable JavaScript.
        </div>
    </noscript>

    <div id="main"></div>
</body>

</html>
